# ============================================================
#  zram: swap comprimido en RAM
#  Destino: /etc/systemd/zram-generator.conf
# ------------------------------------------------------------
#  PROBLEMA QUE RESUELVE
#  La Pi usa cientos de MB de swap sobre /var/swap, que es un
#  fichero en la propia tarjeta SD (/dev/mmcblk0p2). Eso desgasta
#  la SD y la ralentiza muchísimo. Medido: 604 MB y subiendo.
#
#  QUÉ HACE ESTO
#  Crea un dispositivo de swap comprimido en RAM (zram0) con
#  prioridad 100, muy por encima del swap de SD (prioridad -2).
#  El kernel usa zram primero y sólo recurre a la SD si zram se
#  llena, que con compresión zstd es difícil.
#
#  TAMAÑO
#  min(ram / 2, 1024). Con 926 MB de RAM → ~452 MB de dispositivo.
#  zram NO reserva esa memoria de antemano: sólo ocupa lo que se
#  va comprimiendo, y zstd suele dar 2-3x. Es deliberadamente
#  conservador para una primera noche; si sobra holgura, se puede
#  subir a min(ram * 3 / 4, 1024) → ~680 MB.
#
#  La clave `ram` la provee el propio generador (MemTotal).
# ============================================================

[zram0]
zram-size = min(ram / 2, 1024)
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
