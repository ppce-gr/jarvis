# ============================================================
#  zram: swap comprimido en RAM
#  Destino: /etc/systemd/zram-generator.conf
# ------------------------------------------------------------
#  PROBLEMA QUE RESUELVE
#  La Pi está usando 493 MB de swap sobre /var/swap, que es un
#  fichero en la propia tarjeta SD (/dev/mmcblk0p2). Eso desgasta
#  la SD y la ralentiza muchísimo.
#
#  QUÉ HACE ESTO
#  Crea un dispositivo de swap comprimido en RAM (zram0) con
#  prioridad 100, muy por encima del swap de SD (prioridad -2).
#  El kernel usa zram primero y sólo recurre a la SD si zram se
#  llena, que con compresión zstd es difícil.
#
#  Tamaño: la mitad de la RAM, tope 1024 MB. Con zstd, ~1 GB de
#  zram suele dar 2-3 GB efectivos de swap.
# ============================================================

[zram0]
zram-size = min(ram / 2, 1024)
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
