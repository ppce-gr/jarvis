# ============================================================
#  Swap de Jarvis · configuración NATIVA de Raspberry Pi OS
#  Destino: /etc/rpi/swap.conf.d/99-jarvis.conf
# ------------------------------------------------------------
#  HISTORIA (importante, para no repetir el error)
#
#  El primer intento usó `systemd-zram-generator` copiando un
#  /etc/systemd/zram-generator.conf propio. ESO ROMPIÓ EL SISTEMA:
#  Raspberry Pi OS ya trae
#      /usr/lib/systemd/zram-generator.conf          ([zram0] base)
#      /usr/lib/systemd/zram-generator.conf.d/
#          20-rpi-swap-zram0-ctrl.conf               (fs-type=none,
#                                                     host-memory-limit=0)
#  que DESACTIVA zram a propósito: es `rpi-swap` quien lo activa
#  cuando el mecanismo lo pide. Un fichero en /etc/ tiene más
#  precedencia, así que el nuestro sustituyó ese control y dejó la
#  cadena de dependencias rota.
#
#  LA FORMA CORRECTA
#  No tocar zram-generator. Se configura `rpi-swap`, que es el
#  gestor de swap del propio Raspberry Pi OS, mediante un drop-in.
#
#  MECANISMOS DISPONIBLES (man swap.conf)
#    auto       → por defecto hoy "zram+file"
#    swapfile   → fichero de swap tradicional en la raíz  ← lo que
#                 había, y lo que desgasta la SD
#    zram       → swap comprimido en RAM, SIN fichero  ← elegido
#    zram+file  → zram con writeback de páginas ociosas al fichero
#                 (escrituras infrecuentes y agrupadas)
#    none       → sin swap
#
#  POR QUÉ "zram" Y NO "zram+file"
#    El objetivo es dejar de escribir swap en la SD. `zram+file`
#    escribe de forma ocasional, y además su cadena
#    (rpi-setup-loop@var-swap.service) estaba fallando en esta
#    máquina. `zram` puro no usa fichero ni dispositivo loop:
#    cadena más corta y cero escrituras de swap a la SD.
#
#  TAMAÑO
#    RamMultiplier=1 → capacidad DESCOMPRIMIDA igual a la RAM.
#    No reserva esa memoria: consume lo que ocupen las páginas
#    comprimidas (típicamente ~50%). El propio rpi-swap ajusta
#    vm.page-cluster=0 para zram.
#    OJO: valores por encima de 2.0 no se recomiendan.
#
#  SI ALGÚN DÍA HACE FALTA RED DE SEGURIDAD
#    Cambiar a Mechanism=zram+file: mantiene un fichero como
#    respaldo por si zram se llena, con escrituras infrecuentes.
# ============================================================

[Main]
Mechanism=zram

[Zram]
RamMultiplier=1
MaxSizeMiB=2048
