# ============================================================
#  Ajustes de memoria
#  Destino: /etc/sysctl.d/99-jarvis-memoria.conf
# ------------------------------------------------------------
#  vm.swappiness = 100
#    Con zram activo, interesa que el kernel PREFIERA comprimir
#    páginas en RAM antes que descartar cachés de disco. Como
#    zram tiene prioridad 100 y el swap de SD prioridad -2, el
#    intercambio va a RAM comprimida y sólo desborda a SD si
#    zram se llena.
#
#  Si algún día observas escrituras en la SD por swap, baja este
#  valor a 60 o elimina el fichero /var/swap (ver deploy/README.md).
# ============================================================

vm.swappiness = 100
